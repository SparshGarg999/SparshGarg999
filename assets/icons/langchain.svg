<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- LangChain Green/Teal Neon -->
    <linearGradient id="langTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ef98c" />
      <stop offset="100%" stop-color="#00a86b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b101d" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.02" />

  <!-- Neural Chain Links -->
  <g transform="translate(14, 14) scale(0.9)" filter="url(#iconGlow)">
    <!-- Link 1 (Top Left) -->
    <rect x="2" y="2" width="22" height="14" rx="7" fill="none" stroke="url(#langTeal)" stroke-width="2.5" transform="rotate(-30 13 9)" />
    <!-- Link 2 (Bottom Right) -->
    <rect x="14" y="18" width="22" height="14" rx="7" fill="none" stroke="url(#langTeal)" stroke-width="2.5" transform="rotate(-30 25 25)" />
    
    <!-- Neural Node Connections (Dots) -->
    <circle cx="10" cy="15" r="3" fill="#fff" />
    <circle cx="28" cy="25" r="3" fill="#fff" />
    <line x1="10" y1="15" x2="28" y2="25" stroke="#fff" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="2 2" />
  </g>
</svg>
