<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- ServiceNow Green/Teal Neon -->
    <linearGradient id="snGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81B5A3" />
      <stop offset="100%" stop-color="#293e40" />
    </linearGradient>
    <linearGradient id="snBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#81B5A3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b101d" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.02" />

  <!-- ServiceNow Circle & wave logo -->
  <g transform="translate(16, 16)" filter="url(#iconGlow)">
    <!-- Circle -->
    <circle cx="16" cy="16" r="15" fill="none" stroke="url(#snGreen)" stroke-width="2.5" />
    
    <!-- wave logo / "now" curve -->
    <!-- We can draw the word "now" in a beautiful stylized lower-case path -->
    <path d="M 8 13 L 8 20 M 8 16 C 9 14, 11 14, 12 16 L 12 20 M 15 17 C 15 14, 18 14, 18 17 C 18 20, 15 20, 15 17 Z M 21 16 L 22.5 21 L 24 16 Z" fill="none" stroke="url(#snBright)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
