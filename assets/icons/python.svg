<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    
    <!-- Python Blue Neon -->
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80dfff" />
      <stop offset="100%" stop-color="#007acc" />
    </linearGradient>

    <!-- Python Yellow Neon -->
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff080" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b101d" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.02" />

  <!-- Python Icon Path -->
  <g transform="translate(16, 16) scale(1)" filter="url(#iconGlow)">
    <!-- Top/Blue half -->
    <path d="M 16 0 C 11.5 0 8 3.5 8 8 L 8 11 L 16.5 11 L 16.5 12 L 5 12 C 2.2 12 0 14.2 0 17 C 0 19.8 2.2 22 5 22 L 8 22 L 8 19.5 C 8 16.5 10.5 14 13.5 14 L 21 14 C 23.8 14 26 11.8 26 9 C 26 6.2 23.8 4 21 4 L 19 4 L 19 8 C 19 9.7 17.7 11 16 11 L 11 11 C 9.3 11 8 9.7 8 8 C 8 6.3 9.3 5 11 5 L 16 5 L 16 0 Z" fill="url(#pyBlue)" />
    <!-- Bottom/Yellow half -->
    <path d="M 10 32 C 14.5 32 18 28.5 18 24 L 18 21 L 9.5 21 L 9.5 20 L 21 20 C 23.8 20 26 17.8 26 15 C 26 12.2 23.8 10 21 10 L 18 10 L 18 12.5 C 18 15.5 15.5 18 12.5 18 L 5 18 C 2.2 18 0 20.2 0 23 C 0 25.8 2.2 28 5 28 L 7 28 L 7 24 C 7 22.3 8.3 21 10 21 L 15 21 C 16.7 21 18 22.3 18 24 C 18 25.7 16.7 27 15 27 L 10 27 L 10 32 Z" fill="url(#pyYellow)" />
    <!-- Eyes -->
    <circle cx="12" cy="2.5" r="0.75" fill="#0d0f14" />
    <circle cx="14" cy="29.5" r="0.75" fill="#0d0f14" />
  </g>
</svg>
