<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- React Blue Neon -->
    <linearGradient id="reactBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0f0ff" />
      <stop offset="100%" stop-color="#00d8ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b101d" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.02" />

  <!-- React Atom Icon -->
  <g transform="translate(32, 32)" filter="url(#iconGlow)">
    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="3.5" fill="url(#reactBlue)" />
    
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="20" ry="7.5" fill="none" stroke="url(#reactBlue)" stroke-width="1.8" />
    <ellipse cx="0" cy="0" rx="20" ry="7.5" fill="none" stroke="url(#reactBlue)" stroke-width="1.8" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="20" ry="7.5" fill="none" stroke="url(#reactBlue)" stroke-width="1.8" transform="rotate(120)" />
  </g>
</svg>
