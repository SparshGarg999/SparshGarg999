<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- JS Yellow Neon -->
    <linearGradient id="jsYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff677" />
      <stop offset="100%" stop-color="#f7df1e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b101d" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.02" />

  <!-- JavaScript Text Icon -->
  <g transform="translate(0, 0)" filter="url(#iconGlow)">
    <!-- Yellow Corner Accent -->
    <path d="M 44 14 L 48 14 L 48 18" fill="none" stroke="url(#jsYellow)" stroke-width="1.5" />
    
    <!-- JS Letters -->
    <text x="32" y="42" fill="url(#jsYellow)" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="1">JS</text>
    
    <!-- Little circuit link -->
    <line x1="16" y1="46" x2="48" y2="46" stroke="url(#jsYellow)" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="16" cy="46" r="2" fill="#fff" />
    <circle cx="48" cy="46" r="2" fill="#fff" />
  </g>
</svg>
