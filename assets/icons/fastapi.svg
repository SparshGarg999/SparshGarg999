<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- Teal Neon Gradient -->
    <linearGradient id="fastapiTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b101d" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.02" />

  <!-- FastAPI Logo Icon -->
  <g transform="translate(16, 14) scale(1)" filter="url(#iconGlow)">
    <!-- Main Outer Circle -->
    <circle cx="16" cy="18" r="16" fill="none" stroke="url(#fastapiTeal)" stroke-width="2.5" />
    <!-- Lightning Bolt F / F-Bolt -->
    <path d="M 18 6 L 10 18 L 16 18 L 13 30 L 22 16 L 16 16 Z" fill="url(#fastapiTeal)" />
  </g>
</svg>
