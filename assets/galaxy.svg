<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Core Bright Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#7b00ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Spiral Arm Glowing Line Gradient -->
    <linearGradient id="armCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#0055ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="armMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" stop-opacity="1" />
      <stop offset="50%" stop-color="#bd00ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="holoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes spinGalaxy {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulsateCore {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .galaxy-arms {
        animation: spinGalaxy 40s linear infinite;
        transform-origin: 250px 250px;
      }
      .galaxy-core {
        animation: pulsateCore 4s ease-in-out infinite;
        transform-origin: 250px 250px;
      }
    </style>
  </defs>

  <!-- Deep space backdrop element -->
  <rect width="100%" height="100%" fill="#07080d" fill-opacity="0" />

  <!-- Orbit Tracks -->
  <g stroke="#ffffff" stroke-opacity="0.07" fill="none" stroke-width="1">
    <ellipse cx="250" cy="250" rx="200" ry="120" transform="rotate(-15 250 250)" />
    <ellipse cx="250" cy="250" rx="150" ry="90" transform="rotate(-15 250 250)" />
    <ellipse cx="250" cy="250" rx="100" ry="60" transform="rotate(-15 250 250)" />
  </g>

  <!-- 3D Perspective Rotation Group -->
  <!-- We rotate it to look isometric/3D tilted -->
  <g transform="translate(0, 0) scale(1, 0.7) rotate(-20 250 250)">
    
    <!-- Rotating Spiral Arms -->
    <g class="galaxy-arms">
      <!-- Arm 1 (Cyan/Purple Spiral) -->
      <path d="M 250 250 Q 280 200 340 180 T 420 230 T 450 340" fill="none" stroke="url(#armCyan)" stroke-width="4" filter="url(#holoGlow)" />
      <!-- Dots along Arm 1 -->
      <circle cx="280" cy="210" r="2.5" fill="#00f0ff" />
      <circle cx="310" cy="190" r="3.5" fill="#fff" filter="url(#holoGlow)" />
      <circle cx="350" cy="180" r="2" fill="#00f0ff" />
      <circle cx="390" cy="200" r="3" fill="#fff" />
      <circle cx="420" cy="240" r="2" fill="#bd00ff" />
      <circle cx="440" cy="290" r="1.5" fill="#bd00ff" />

      <!-- Arm 2 (Magenta/Pink Spiral) -->
      <path d="M 250 250 Q 220 300 160 320 T 80 270 T 50 160" fill="none" stroke="url(#armMagenta)" stroke-width="4" filter="url(#holoGlow)" />
      <!-- Dots along Arm 2 -->
      <circle cx="220" cy="290" r="2.5" fill="#ff007a" />
      <circle cx="190" cy="310" r="3.5" fill="#fff" filter="url(#holoGlow)" />
      <circle cx="150" cy="320" r="2" fill="#ff007a" />
      <circle cx="110" cy="300" r="3" fill="#fff" />
      <circle cx="80" cy="260" r="2" fill="#00f0ff" />
      <circle cx="60" cy="210" r="1.5" fill="#00f0ff" />

      <!-- Faint Dust clouds -->
      <path d="M 250 250 C 350 150 450 250 450 350" fill="none" stroke="#bd00ff" stroke-width="15" stroke-opacity="0.1" stroke-linecap="round" />
      <path d="M 250 250 C 150 350 50 250 50 150" fill="none" stroke="#00f0ff" stroke-width="15" stroke-opacity="0.1" stroke-linecap="round" />
    </g>

    <!-- Bright Galaxy Center Core -->
    <circle cx="250" cy="250" r="35" fill="url(#coreGlow)" class="galaxy-core" />
    <circle cx="250" cy="250" r="10" fill="#ffffff" filter="url(#holoGlow)" />

  </g>
</svg>
