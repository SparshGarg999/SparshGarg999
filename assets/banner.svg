<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Magenta Glow -->
    <filter id="neonMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      @keyframes floatPlanets {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .glowing-node {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .floating-elements {
        animation: floatPlanets 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bannerBg)" />

  <!-- Diagonal Tech Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.1" stroke-width="1" fill="none">
    <line x1="0" y1="50" x2="1000" y2="50" />
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="200" y1="0" x2="250" y2="200" />
    <line x1="800" y1="0" x2="750" y2="200" />
    <line x1="450" y1="0" x2="550" y2="200" stroke-opacity="0.05" />
  </g>

  <!-- Stars -->
  <g fill="#fff" opacity="0.3">
    <circle cx="80" cy="40" r="1" />
    <circle cx="340" cy="20" r="1.5" />
    <circle cx="720" cy="30" r="1" />
    <circle cx="910" cy="25" r="1.2" />
    <circle cx="150" cy="160" r="1.5" />
    <circle cx="580" cy="170" r="1" />
    <circle cx="850" cy="180" r="1.2" />
  </g>

  <!-- Left Side Floating Isometric Elements -->
  <g class="floating-elements" transform="translate(100, 100) scale(0.8)">
    <circle cx="0" cy="0" r="30" fill="#00f0ff" fill-opacity="0.1" filter="url(#neonCyan)" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00f0ff" stroke-width="2" />
    <!-- Tilted Ring -->
    <ellipse cx="0" cy="0" rx="45" ry="12" fill="none" stroke="#ff007a" stroke-width="1.5" transform="rotate(15)" />
    <!-- Small dot node -->
    <circle cx="43" cy="5" r="3" fill="#fff" />
  </g>

  <!-- Right Side Floating Isometric Elements -->
  <g class="floating-elements" transform="translate(900, 90) scale(0.6)" style="animation-delay: -3s;">
    <circle cx="0" cy="0" r="40" fill="#ff007a" fill-opacity="0.1" filter="url(#neonMagenta)" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff007a" stroke-width="2" />
    <!-- Tilted Ring -->
    <ellipse cx="0" cy="0" rx="60" ry="15" fill="none" stroke="#00f0ff" stroke-width="1.5" transform="rotate(-15)" />
  </g>

  <!-- Center Text and HUD Branding -->
  <g transform="translate(500, 100)" text-anchor="middle">
    <!-- Subtitle Telemetry -->
    <text x="0" y="-30" fill="#00f0ff" fill-opacity="0.6" font-family="'Courier New', monospace" font-size="12" letter-spacing="4">SYS.AUTO.LOAD: SPG_999</text>
    
    <!-- Profile Branding -->
    <text x="0" y="15" fill="#ffffff" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="36" letter-spacing="3" filter="url(#neonCyan)">SPARSH GARG</text>
    
    <!-- Glowing Accent Underline -->
    <line x1="-120" y1="28" x2="120" y2="28" stroke="#00f0ff" stroke-width="2" filter="url(#neonCyan)" />
    <!-- Central Node -->
    <circle cx="0" cy="28" r="4" fill="#fff" class="glowing-node" />
    <circle cx="-120" cy="28" r="3" fill="#bd00ff" />
    <circle cx="120" cy="28" r="3" fill="#bd00ff" />

    <text x="0" y="48" fill="#8892b0" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">INTELLIGENT WORKFLOWS &amp; AGENTIC RAG</text>
  </g>
</svg>
