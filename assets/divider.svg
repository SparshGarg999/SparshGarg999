<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="100%">
  <defs>
    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#bd00ff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#bd00ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseLaser {
        0%, 100% { transform: scaleY(0.85); opacity: 0.8; }
        50% { transform: scaleY(1.15); opacity: 1; }
      }
      @keyframes pulseCenter {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00f0ff); }
        50% { transform: scale(1.3); filter: drop-shadow(0 0 6px #00f0ff); }
      }
      .laser-line {
        animation: pulseLaser 4s ease-in-out infinite;
        transform-origin: center;
      }
      .laser-center {
        animation: pulseCenter 2s ease-in-out infinite;
        transform-origin: 400px 20px;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- Laser Beam Line -->
  <line x1="50" y1="20" x2="750" y2="20" stroke="url(#laserGrad)" stroke-width="3" filter="url(#laserGlow)" class="laser-line" />
  
  <!-- Outer Accent Rings -->
  <circle cx="400" cy="20" r="8" fill="none" stroke="#bd00ff" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="400" cy="20" r="14" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4" />

  <!-- Glowing Center Node -->
  <circle cx="400" cy="20" r="4.5" fill="#ffffff" class="laser-center" />
</svg>
