<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Cyan Planet Gradient -->
    <radialGradient id="cyanPlanet" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#80f8ff" />
      <stop offset="35%" stop-color="#00c8ff" />
      <stop offset="70%" stop-color="#005b8a" />
      <stop offset="100%" stop-color="#001830" />
    </radialGradient>

    <!-- Magenta Moon Gradient -->
    <radialGradient id="magentaMoon" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="40%" stop-color="#ff007a" />
      <stop offset="80%" stop-color="#8c0052" />
      <stop offset="100%" stop-color="#2a001a" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff007a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="planetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatPlanet {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatMoon {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(8px, -15px); }
      }
      .planet-group {
        animation: floatPlanet 7s ease-in-out infinite;
        transform-origin: 180px 150px;
      }
      .moon-group {
        animation: floatMoon 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep space backdrop element -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Background Glow of the Planet -->
  <circle cx="180" cy="150" r="65" fill="#00c8ff" fill-opacity="0.15" filter="url(#planetGlow)" />

  <!-- 3D Layered Planet 1 (Saturn-like) -->
  <g class="planet-group">
    <!-- 1. Back of the Ring -->
    <!-- Draw only the top/back arc of the ring -->
    <path d="M 80 160 A 110 35 0 0 1 280 140" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    
    <!-- 2. The Main Planet Sphere -->
    <circle cx="180" cy="150" r="55" fill="url(#cyanPlanet)" />

    <!-- Planet Shadow Overlay for Depth -->
    <circle cx="180" cy="150" r="55" fill="#000000" fill-opacity="0.3" clip-path="polygon(0 0, 100% 0, 100% 100%)" style="mix-blend-mode: multiply;" />

    <!-- 3. Front of the Ring -->
    <!-- Draw only the bottom/front arc of the ring (overlapping the planet) -->
    <path d="M 280 140 A 110 35 0 0 1 80 160" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Floating Moon -->
  <g class="moon-group" transform="translate(0, 0)">
    <!-- Moon Glow -->
    <circle cx="310" cy="70" r="25" fill="#ff007a" fill-opacity="0.2" filter="url(#planetGlow)" />
    <!-- Moon Body -->
    <circle cx="310" cy="70" r="18" fill="url(#magentaMoon)" />
  </g>

  <!-- Small Particle Rings orbiting the moon -->
  <ellipse cx="310" cy="70" rx="28" ry="12" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1" transform="rotate(-10 310 70)" />
</svg>
