<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Top Line Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blinkNode {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes spinCircle {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .tele-blink {
        animation: blinkNode 2s ease-in-out infinite;
      }
      .tele-spin {
        animation: spinCircle 15s linear infinite;
        transform-origin: 500px 65px;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- Laser Top Line -->
  <line x1="50" y1="10" x2="950" y2="10" stroke="url(#laserGrad)" stroke-width="1.5" />

  <!-- Corner Tech Details -->
  <!-- Top Left Corner Mark -->
  <path d="M 50 25 L 50 15 L 60 15" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Top Right Corner Mark -->
  <path d="M 950 25 L 950 15 L 940 15" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Left Side Telemetry -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#64748b" letter-spacing="1">
    <text x="65" y="45" fill="#e2e8f0" font-weight="bold">PORTAL CONSOLE: ACTIVE</text>
    <text x="65" y="65">SPARSH GARG // DEV_BUILD_V2.6.20</text>
    <text x="65" y="85">LOC: 26.4499° N, 74.6399° E // AJMER, IN</text>
  </g>

  <!-- Central Rotating Scope -->
  <g class="tele-spin">
    <circle cx="500" cy="65" r="25" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.3" />
    <circle cx="500" cy="65" r="20" fill="none" stroke="#bd00ff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4" />
    <line x1="475" y1="65" x2="525" y2="65" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.2" />
    <line x1="500" y1="40" x2="500" y2="90" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.2" />
  </g>
  <circle cx="500" cy="65" r="3" fill="#ffffff" filter="url(#neonCyan)" />

  <!-- Right Side Telemetry -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#64748b" text-anchor="end" letter-spacing="1">
    <text x="935" y="45" fill="#00f0ff" font-weight="bold">SYSTEM STATUS: OPERATIONAL</text>
    <text x="935" y="65">ENVIRONMENT: DOCKER_CONTAINER_A</text>
    
    <!-- Status Blinker -->
    <g transform="translate(935, 76)">
      <circle cx="-135" cy="4" r="3.5" fill="#00f0ff" filter="url(#neonCyan)" class="tele-blink" />
      <text x="0" y="8" fill="#e2e8f0">NEURAL_AGENTS_STREAMING: [OK]</text>
    </g>
  </g>

  <!-- Bottom Accent Details -->
  <rect x="420" y="105" width="160" height="2" fill="#00f0ff" fill-opacity="0.3" />
  <circle cx="500" cy="106" r="1.5" fill="#fff" />
</svg>
