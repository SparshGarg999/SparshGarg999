<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Space Base Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#0a0c16" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>

    <!-- Glowing Cyan Nebula Gradient -->
    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#00a8ff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Purple Nebula Gradient -->
    <radialGradient id="nebulaPurple" cx="80%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#7b00ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animation CSS -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes twinkle1 {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes twinkle2 {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.1; }
      }
      @keyframes twinkle3 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      
      .nebula-c {
        animation: pulseGlow 12s ease-in-out infinite;
        transform-origin: 20% 30%;
      }
      .nebula-p {
        animation: pulseGlow 18s ease-in-out infinite;
        transform-origin: 80% 70%;
      }
      .star-fast {
        animation: twinkle1 2s ease-in-out infinite;
      }
      .star-medium {
        animation: twinkle2 3.5s ease-in-out infinite;
      }
      .star-slow {
        animation: twinkle3 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Dark Base -->
  <rect width="100%" height="100%" fill="url(#spaceBg)" />

  <!-- Nebulae -->
  <rect width="100%" height="100%" fill="url(#nebulaCyan)" class="nebula-c" />
  <rect width="100%" height="100%" fill="url(#nebulaPurple)" class="nebula-p" />

  <!-- Starfield Layer ( Twinkling Stars ) -->
  <g id="stars">
    <!-- Fast Stars -->
    <circle cx="150" cy="120" r="1" fill="#fff" class="star-fast" />
    <circle cx="340" cy="80" r="1.5" fill="#00f0ff" class="star-fast" filter="url(#glow)" />
    <circle cx="720" cy="150" r="1" fill="#fff" class="star-fast" />
    <circle cx="950" cy="90" r="1.2" fill="#fff" class="star-fast" />
    <circle cx="1100" cy="220" r="1.5" fill="#bd00ff" class="star-fast" filter="url(#glow)" />
    <circle cx="80" cy="450" r="1" fill="#fff" class="star-fast" />
    <circle cx="450" cy="620" r="1.3" fill="#fff" class="star-fast" />
    <circle cx="830" cy="510" r="1" fill="#fff" class="star-fast" />
    <circle cx="1020" cy="680" r="1.6" fill="#00f0ff" class="star-fast" filter="url(#glow)" />

    <!-- Medium Stars -->
    <circle cx="210" cy="280" r="1.5" fill="#fff" class="star-medium" />
    <circle cx="410" cy="190" r="1.2" fill="#bd00ff" class="star-medium" />
    <circle cx="580" cy="70" r="2" fill="#fff" class="star-medium" filter="url(#glow)" />
    <circle cx="810" cy="290" r="1.5" fill="#fff" class="star-medium" />
    <circle cx="1150" cy="400" r="1.3" fill="#00f0ff" class="star-medium" />
    <circle cx="290" cy="530" r="2.2" fill="#fff" class="star-medium" filter="url(#glow)" />
    <circle cx="620" cy="480" r="1.2" fill="#fff" class="star-medium" />
    <circle cx="780" cy="690" r="1" fill="#bd00ff" class="star-medium" />
    <circle cx="910" cy="590" r="1.8" fill="#fff" class="star-medium" />

    <!-- Slow Stars -->
    <circle cx="120" cy="200" r="2.5" fill="#fff" class="star-slow" filter="url(#glow)" />
    <circle cx="260" cy="380" r="1.2" fill="#00f0ff" class="star-slow" />
    <circle cx="510" cy="310" r="1.5" fill="#fff" class="star-slow" />
    <circle cx="690" cy="370" r="2.2" fill="#fff" class="star-slow" filter="url(#glow)" />
    <circle cx="890" cy="180" r="1.2" fill="#bd00ff" class="star-slow" />
    <circle cx="1040" cy="320" r="2" fill="#fff" class="star-slow" filter="url(#glow)" />
    <circle cx="180" cy="650" r="1.5" fill="#fff" class="star-slow" />
    <circle cx="390" cy="740" r="1.8" fill="#fff" class="star-slow" />
    <circle cx="560" cy="580" r="2.5" fill="#00f0ff" class="star-slow" filter="url(#glow)" />
    <circle cx="710" cy="780" r="1.2" fill="#fff" class="star-slow" />
    <circle cx="960" cy="460" r="1.5" fill="#bd00ff" class="star-slow" />
  </g>
</svg>
