<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="bubbleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="bubbleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .msg-1 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0.1s; opacity: 0; }
      .msg-2 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0.7s; opacity: 0; }
      .msg-3 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 1.3s; opacity: 0; }
      .msg-4 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 1.9s; opacity: 0; }
      .msg-5 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 2.5s; opacity: 0; }
      .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Main Messenger Container Window -->
  <rect x="10" y="10" width="780" height="400" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Header Bar -->
  <path d="M 10,26 Q 10,10 26,10 L 774,10 Q 790,10 790,26 L 790,60 L 10,60 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="60" x2="790" y2="60" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls Buttons -->
  <circle cx="32" cy="35" r="6" fill="#ff5f56" />
  <circle cx="52" cy="35" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="35" r="6" fill="#27c93f" />

  <!-- Avatar & Online Status Indicator -->
  <circle cx="110" cy="35" r="14" fill="#00f0ff" opacity="0.2"/>
  <circle cx="110" cy="35" r="10" fill="#00f0ff"/>
  <text x="110" y="39" font-size="10" font-weight="bold" fill="#090d16" text-anchor="middle">SG</text>
  
  <text x="132" y="33" font-size="14" font-weight="bold" fill="#f0f6fc">Sparsh AI Assistant</text>
  <circle cx="137" cy="45" r="4" fill="#3fb950" class="pulse-dot"/>
  <text x="146" y="48" font-size="11" fill="#8b949e">ONLINE • Responding in real-time</text>

  <!-- Active Session Badge -->
  <rect x="640" y="24" width="135" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="707" y="40" font-size="10" font-weight="bold" fill="#58a6ff" text-anchor="middle">SESSION #2026-LIVE</text>

  <!-- CHAT MESSAGES AREA -->

  <!-- Message 1: Assistant Welcome -->
  <g class="msg-1">
    <rect x="30" y="80" width="460" height="48" rx="12" fill="url(#bubbleLeft)" stroke="#388bfd" stroke-opacity="0.3"/>
    <text x="45" y="100" font-size="13" font-weight="bold" fill="#58a6ff">💬 Sparsh Bot</text>
    <text x="45" y="118" font-size="12" fill="#e6edf3">👋 Hi Visitor! Welcome to Sparsh Garg's GitHub Profile.</text>
  </g>

  <!-- Message 2: System Query -->
  <g class="msg-2">
    <rect x="520" y="140" width="250" height="38" rx="12" fill="url(#bubbleRight)"/>
    <text x="535" y="163" font-size="12" font-weight="500" fill="#ffffff">⚡ Fetching Developer Bio &amp; Specs...</text>
  </g>

  <!-- Message 3: Role & Experience -->
  <g class="msg-3">
    <rect x="30" y="190" width="580" height="52" rx="12" fill="url(#bubbleLeft)" stroke="#30363d"/>
    <text x="45" y="210" font-size="13" font-weight="bold" fill="#79c0ff">💼 Software Developer @ Genpact</text>
    <text x="45" y="229" font-size="12" fill="#c9d1d9">Engineering ServiceNow &amp; Esker workflow automations with LLMs.</text>
  </g>

  <!-- Message 4: Open Source Impact -->
  <g class="msg-4">
    <rect x="30" y="254" width="620" height="52" rx="12" fill="url(#bubbleLeft)" stroke="#30363d"/>
    <text x="45" y="274" font-size="13" font-weight="bold" fill="#7ee787">🏆 Open Source Contributor</text>
    <text x="45" y="293" font-size="12" fill="#c9d1d9">Active PRs in Facebook (React), Google (TensorFlow), Microsoft &amp; K8s!</text>
  </g>

  <!-- Message 5: Stats & Knight Status -->
  <g class="msg-5">
    <rect x="30" y="318" width="540" height="46" rx="12" fill="url(#bubbleLeft)" stroke="#388bfd" stroke-opacity="0.4"/>
    <text x="45" y="337" font-size="13" font-weight="bold" fill="#ffa657">⚔️ LeetCode Knight (1900+ Rating)</text>
    <text x="45" y="354" font-size="12" fill="#c9d1d9">Smart India Hackathon 2022 National Runner-Up (out of 20,000+ teams).</text>
  </g>

  <!-- Bottom Input Bar Visual -->
  <rect x="30" y="375" width="740" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="45" y="393" font-size="11" fill="#8b949e">Type a command or scroll down to explore repositories...</text>
  <circle cx="755" cy="389" r="8" fill="#238636"/>
  <path d="M 751,389 L 759,389 M 756,385 L 759,389 L 756,393" stroke="#ffffff" stroke-width="1.5" fill="none"/>
</svg>
