<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="bubbleBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .msg-1 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 0.1s; opacity: 0; }
      .msg-2 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 0.6s; opacity: 0; }
      .msg-3 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 1.1s; opacity: 0; }

      .pulse-dot { animation: pulse 2s infinite ease-in-out; }
      .blink-cursor { animation: cursorBlink 1s infinite; }

      .chat-btn {
        transition: all 0.25s ease-in-out;
        cursor: pointer;
      }
      .chat-btn:hover rect {
        fill: #1e293b;
        stroke: #00f0ff;
        stroke-width: 1.5px;
        filter: drop-shadow(0px 0px 8px rgba(0, 240, 255, 0.4));
      }
      .chat-btn:hover text {
        fill: #00f0ff;
      }
    </style>
  </defs>

  <!-- Main Messenger Container Window -->
  <rect x="10" y="10" width="780" height="430" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Header Bar -->
  <path d="M 10,26 Q 10,10 26,10 L 774,10 Q 790,10 790,26 L 790,60 L 10,60 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="60" x2="790" y2="60" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls Buttons -->
  <circle cx="32" cy="35" r="6" fill="#ff5f56" />
  <circle cx="52" cy="35" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="35" r="6" fill="#27c93f" />

  <!-- Avatar & Online Status Indicator -->
  <circle cx="110" cy="35" r="14" fill="#00f0ff" opacity="0.2"/>
  <circle cx="110" cy="35" r="10" fill="#00f0ff"/>
  <text x="110" y="39" font-size="10" font-weight="bold" fill="#090d16" text-anchor="middle">SG</text>
  
  <text x="132" y="33" font-size="14" font-weight="bold" fill="#f0f6fc">Sparsh AI Assistant</text>
  <circle cx="137" cy="45" r="4" fill="#3fb950" class="pulse-dot"/>
  <text x="146" y="48" font-size="11" fill="#8b949e">ONLINE • Click any message to interact</text>

  <!-- Active Session Badge -->
  <rect x="640" y="24" width="135" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="707" y="40" font-size="10" font-weight="bold" fill="#58a6ff" text-anchor="middle">INTERACTIVE CHAT</text>

  <!-- CHAT MESSAGES AREA -->

  <!-- Message 1: Initial Bot Greeting -->
  <g class="msg-1">
    <rect x="30" y="78" width="490" height="46" rx="12" fill="url(#bubbleBot)" stroke="#388bfd" stroke-opacity="0.4"/>
    <text x="45" y="97" font-size="12" font-weight="bold" fill="#58a6ff">💬 Sparsh Bot</text>
    <text x="45" y="114" font-size="12" fill="#e6edf3">👋 Hi there! I'm Sparsh's Profile Assistant. What would you like to know?</text>
  </g>

  <!-- Message 2: System Prompt -->
  <g class="msg-2">
    <rect x="540" y="132" width="230" height="34" rx="12" fill="url(#bubbleUser)"/>
    <text x="555" y="153" font-size="11" font-weight="600" fill="#ffffff">👇 Select a prompt to explore:</text>
  </g>

  <!-- Message 3: INTERACTIVE CLICKABLE OPTIONS -->
  <g class="msg-3">
    <!-- Option 1: Current Role & LLM Workflows -->
    <a href="#-about-me" class="chat-btn">
      <g transform="translate(30, 178)">
        <rect width="740" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="15" y="28" font-size="12" font-weight="bold" fill="#79c0ff">💼 "What is Sparsh's current role at Genpact?"</text>
        <text x="540" y="28" font-size="11" fill="#8b949e">ServiceNow + Esker + LLMs ➔</text>
      </g>
    </a>

    <!-- Option 2: Open Source Contributions (React, TensorFlow, MSFT) -->
    <a href="#-open-source-contributions--merged-prs" class="chat-btn">
      <g transform="translate(30, 234)">
        <rect width="740" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="15" y="28" font-size="12" font-weight="bold" fill="#7ee787">🏆 "Show Open Source PRs (Facebook React, Google TensorFlow)"</text>
        <text x="580" y="28" font-size="11" fill="#8b949e">View PR Matrix ➔</text>
      </g>
    </a>

    <!-- Option 3: Featured Systems (NEXUS Multi-Agent AI) -->
    <a href="#-featured-systems--projects" class="chat-btn">
      <g transform="translate(30, 290)">
        <rect width="740" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="15" y="28" font-size="12" font-weight="bold" fill="#d2a8ff">🪐 "Tell me about NEXUS Autonomous Multi-Agent AI Hub"</text>
        <text x="580" y="28" font-size="11" fill="#8b949e">View Projects ➔</text>
      </g>
    </a>

    <!-- Option 4: Direct Message / Mail -->
    <a href="mailto:sparshgarg307@gmail.com" class="chat-btn">
      <g transform="translate(30, 346)">
        <rect width="740" height="48" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
        <text x="15" y="28" font-size="12" font-weight="bold" fill="#ffa657">✉️ "Send a Direct Message / Email to Sparsh"</text>
        <text x="580" y="28" font-size="11" fill="#ffa657">sparshgarg307@gmail.com ➔</text>
      </g>
    </a>
  </g>

  <!-- Bottom Input Bar Visual with blinking cursor -->
  <rect x="30" y="402" width="740" height="24" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="42" y="418" font-size="11" fill="#58a6ff">&gt; User selected input...<tspan class="blink-cursor" fill="#00f0ff">_</tspan></text>
</svg>
